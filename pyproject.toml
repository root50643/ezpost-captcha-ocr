[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezpost-captcha-ocr"
version = "1.0.0"
description = "Adaptive color separation and digit template recognition for EZPost images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.8,<6"]

[project.optional-dependencies]
docs = ["Pillow>=10.1"]
baseline = ["pytesseract>=0.3.13,<0.4"]

[project.scripts]
ezpost-ocr = "ezpost_ocr.cli:main"
ezpost-train = "ezpost_ocr.training:main"
ezpost-evaluate = "ezpost_ocr.evaluation:main"

[tool.setuptools]
packages = ["ezpost_ocr"]
